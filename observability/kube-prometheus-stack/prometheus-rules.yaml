# Alerting rules for PostgreSQL + pgBouncer under the Percona operator.
#
# These are written to be read as much as to fire. Each one states what it
# detects and — more usefully — what it does NOT detect, because the gap between
# those two is where incidents live.
#
# Alertmanager is disabled in this lab, so a firing rule shows up in the
# Prometheus UI under Alerts rather than paging anyone.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: percona-pg-lab
  labels:
    percona-pg-lab.io/component: observability
spec:
  groups:
    - name: postgresql.availability
      rules:
        - alert: PostgresInstanceDown
          expr: pg_up == 0
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: "PostgreSQL instance {{ $labels.pg_pod }} is not responding"
            description: >-
              The exporter cannot reach PostgreSQL on {{ $labels.pg_pod }}.
              Note this fires per instance, so during a normal failover you
              should expect exactly one of these for roughly a minute. Two at
              once on a three-node cluster means you have lost quorum.

        - alert: PostgresNoPrimary
          # The condition that actually causes an outage. A cluster can have
          # every pod Running and still be unwritable if no member holds the
          # leader lease.
          expr: |
            count by (pg_cluster, pg_namespace) (pg_up{pg_role="primary"} == 1) == 0
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: "Cluster {{ $labels.pg_cluster }} has no primary"
            description: >-
              No member is reporting the primary role. Writes are failing.
              Check `patronictl list` inside any database container.

        - alert: PostgresTooManyPrimaries
          # Split brain. Patroni's leader lease should make this impossible;
          # if it fires, do not "fix" it by restarting things at random.
          expr: |
            count by (pg_cluster, pg_namespace) (pg_up{pg_role="primary"} == 1) > 1
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: "Cluster {{ $labels.pg_cluster }} reports more than one primary"

    - name: postgresql.replication
      rules:
        - alert: PostgresReplicationLagHigh
          expr: pg_stat_replication_pg_wal_lsn_diff > 64 * 1024 * 1024
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "Replication lag above 64MB on {{ $labels.pg_cluster }}"
            description: >-
              A standby is more than 64MB of WAL behind. With synchronous_mode
              on, a lagging *synchronous* standby also slows every commit on the
              primary — so this can present as a write-latency problem rather
              than a replication problem.

        - alert: PostgresReplicaCountLow
          expr: |
            count by (pg_cluster, pg_namespace) (pg_up{pg_role="replica"} == 1) < 2
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Fewer than two standbys in {{ $labels.pg_cluster }}"
            description: >-
              Down to one standby. The cluster still fails over, but the next
              failure is an outage. Ten-minute delay so that ordinary rolling
              restarts do not trip it.

    - name: pgbouncer
      rules:
        - alert: PgBouncerClientsWaiting
          # The single most useful pooling alert. Clients waiting means demand
          # for backends exceeds default_pool_size — raise the pool, or find
          # the slow query holding backends open.
          expr: sum by (pg_cluster, database) (pgbouncer_pools_client_waiting_connections) > 0
          for: 2m
          labels: {severity: warning}
          annotations:
            summary: "Clients queueing for a backend in {{ $labels.pg_cluster }}/{{ $labels.database }}"
            description: >-
              Every waiting client is added latency invisible to PostgreSQL's own
              metrics — pg_stat_statements will show healthy query times while
              users see timeouts. See docs/04-connection-pooling.md#sizing

        - alert: PgBouncerPoolNearlyExhausted
          expr: |
            sum by (pg_cluster, database) (pgbouncer_pools_server_active_connections)
              / clamp_min(sum by (pg_cluster, database) (pgbouncer_pools_server_active_connections
                + pgbouncer_pools_server_idle_connections), 1) > 0.9
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "pgBouncer pool over 90% utilised in {{ $labels.pg_cluster }}"

        - alert: PgBouncerDown
          expr: pgbouncer_up == 0
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: "pgBouncer exporter cannot reach its pooler on {{ $labels.pgbouncer_pod }}"

    - name: postgresql.saturation
      rules:
        - alert: PostgresConnectionsNearLimit
          expr: |
            sum by (pg_cluster, pg_pod) (pg_stat_activity_count)
              / clamp_min(pg_settings_max_connections, 1) > 0.8
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "Over 80% of max_connections used on {{ $labels.pg_pod }}"
            description: >-
              If this fires on a cluster that has pgBouncer in front of it,
              suspect clients bypassing the pooler rather than genuine load.

        - alert: PostgresTransactionIDWraparoundRisk
          # Slow-moving and catastrophic: PostgreSQL shuts down to protect
          # itself at 2 billion. 200 million is early enough to fix calmly.
          expr: pg_database_xid_age > 200000000
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: "Transaction ID age above 200M on {{ $labels.datname }}"
            description: >-
              Autovacuum is not keeping up. Usually a long-running transaction,
              an abandoned replication slot, or hot_standby_feedback holding
              back the xmin horizon.

        - alert: PostgresLowCacheHitRatio
          expr: |
            sum by (pg_pod) (rate(pg_stat_database_blks_hit[10m]))
              / clamp_min(sum by (pg_pod) (rate(pg_stat_database_blks_hit[10m])
                + rate(pg_stat_database_blks_read[10m])), 1) < 0.9
          for: 15m
          labels: {severity: info}
          annotations:
            summary: "Buffer cache hit ratio below 90% on {{ $labels.pg_pod }}"
            description: >-
              Informational, not actionable on its own. A freshly restarted or
              restored instance always looks like this until its cache warms.
